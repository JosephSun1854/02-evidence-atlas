name: Verify retrieval and data safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - run: npm run benchmark
      - name: Verify committed benchmark is reproducible
        run: git diff --exit-code -- docs/benchmark.md docs/benchmark.json
